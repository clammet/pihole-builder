name: Validate builder
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install filesystem tools
        run: sudo apt-get update && sudo apt-get install -y btrfs-progs fdisk e2fsprogs shellcheck
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Render provisioning and check shell syntax
        run: |
          python3 build.py --set 'admin_password="ci-only-test-password"' --render-only build/ci
          bash -n build/ci/script
          shellcheck build/ci/script build/ci/payload/clean-seed.sh
      - name: Exercise real image partitioning and filesystem resize
        run: sudo env PIHOLE_DISK_TESTS=1 python3 -m unittest discover -s tests -p test_disk_integration.py -v
